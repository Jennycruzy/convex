# CONVEX thresholds. Hot-loadable: every read goes through convex.config.load(),
# which re-reads this file when its mtime changes, so a running session picks up
# an edit at the next decision cycle without a restart.
#
# Law 1: every number here that describes the market is a hypothesis until it has
# been measured against the live paper API. Values marked MEASURED carry the date
# they were measured and the script that produced them. Values marked HYPOTHESIS
# have not been measured yet and must not be relied on in a live decision.

# Unmeasured values, named where code can read them rather than only where a
# person can, and split by whether trading on them is safe.
#
# The distinction is the direction the error runs in. Over-stating what
# execution costs can only refuse a candidate that was marginally worth taking;
# it can never admit one that was not. Under-stating it does the opposite, and
# that is the single failure this whole project exists to avoid. So a value
# that is deliberately set above what it can plausibly be is safe to trade on
# while it waits to be measured, and a value that could be too low is not.
#
# The calibration check blocks on `hypothesis` and reports `conservative_bound`
# without blocking. Both lists shrink as measurement replaces their entries.
provenance:

  # Could be wrong in the dangerous direction. The agent will not open a
  # position while any of these is listed.
  hypothesis:
    - reconstruction.risk_free_rate

  # Set high on purpose, pending measurement. None of these can be measured
  # before a real fill exists: slippage is a fill against the mid it was sent
  # at, both fees arrive on the account's activity record, and the pin band
  # needs a real close watched. Trading on a deliberate over-estimate is how
  # that circle gets broken without pretending to know a number.
  conservative_bound:
    - session.pin_band_pct
    - costs.slippage_ticks_per_leg

underlying:
  symbol: SPY
  contract_multiplier: 100          # MEASURED at runtime from the contract record

data:
  # Which Alpaca feeds this account is entitled to. Set once, verified on the
  # first call: an entitlement the account does not have fails loudly rather
  # than silently degrading to a thinner feed.
  options_feed: indicative     # indicative | opra
  stock_feed: iex              # iex | sip
  scenario_lookback_days: 750  # history used to build the terminal distribution

session:
  timezone: America/New_York
  entry_time: "10:00"               # the paper's main specification
  close_time: "16:00"
  assignment_guard_minutes: 30      # no leg that can settle into shares survives this
  # How close to a strike still counts as at risk of exercise. SPY is physically
  # settled, so a leg pinned to its strike at 15:45 can become a hundred shares
  # overnight. BOUND until the closing minutes of a real session have been
  # watched, and set wide rather than narrow: a band that is too wide closes a
  # leg that was never going to be assigned, which costs a spread, while one
  # that is too narrow carries a hundred shares per contract into the weekend.
  pin_band_pct: 0.0025
  manager_poll_seconds: 60          # how often the guard re-reads the account

candidates:
  # The paper's 0.98-1.02 moneyness band, expressed as a fraction of spot so it
  # translates from SPX to SPY without carrying absolute point widths across.
  moneyness_low: 0.98
  moneyness_high: 1.02
  min_wing_width_pct: 0.002         # narrowest wing worth trading, fraction of spot
  max_wing_width_pct: 0.020
  # How far down its own ranking a family may look for a structure that clears
  # every check. Each one still has to clear all of them, so this is not a
  # loosening: it stops one wide leg on the best-ranked structure from taking
  # the family down when the one behind it is tradeable. Bounded because the
  # ranking is net of cost and the tail of it is not worth opening.
  max_ranked_attempts: 25
  max_candidates_per_structure: 400
  # The cheapest leg worth building a structure out of, in dollars of mid.
  # MEASURED 2026-09-02 on the recorded 1 September SPY 0DTE chain: the 27 legs
  # quoted under 0.25 carry a median relative spread of 14.29 percent, against
  # 1.33 percent for the 69 legs above it. The break-even for the strategy sits
  # between 1.0 and 1.5 percent, so the cheap legs are an order of magnitude the
  # wrong side of it and every structure containing one is refused downstream
  # anyway. This declines to build them rather than pricing and refusing them.
  min_leg_premium: 0.25

costs:
  # Law 7. Populated by scripts/calibrate_costs.py against real SPY 0DTE quotes.
  slippage_ticks_per_leg: 1.0       # BOUND: a full tick beyond mid on every leg
  tick_size: 0.01                   # MEASURED at runtime from quote increments
  # MEASURED 2026-08-31 from the broker's own fee activities: 6.62 dollars
  # across 140 executed contracts, which is 0.047286 per contract. Two
  # independent routes agree on it, the fee activity records and the cash
  # reconciliation in the ledger, so it is a measurement and not an estimate.
  #
  # Alpaca reports one fee bucket and does not separate commission from the
  # regulatory pass-through, so the whole measured figure sits in the first
  # field and the second is zero. That zero is not the dangerous kind this
  # comment used to warn about: nothing is being assumed away, the amount is
  # simply all accounted for one line above.
  per_contract_fee: 0.047286        # MEASURED 2026-08-31 from 140 filled contracts
  regulatory_fee_per_contract: 0.0  # MEASURED: the broker reports no separate line
  exit_reserve_legs: short          # legs assumed to need closing: short | all | none

execution:
  # A multi-leg order is not an open position until Alpaca reports the full
  # quantity filled. A pending order is surfaced and the cycle stops; it is
  # never promoted to a fill by the client that submitted it.
  order_status_timeout_seconds: 30
  order_poll_seconds: 1

  # A canceled entry with nothing filled is a quote that moved away, not a
  # refusal by the risk rules. Each rung re-reads the account, clock, spot and
  # option quotes, re-runs every session and candidate gate, and re-sizes before
  # submitting one tick further across the spread; a rung that no longer clears
  # a gate writes its receipt and stops. Ticks are in costs.tick_size units.
  # An empty list disables the retry and a canceled entry ends the cycle.
  reprice_ticks: [1, 2]

liquidity:
  # The classified replay remains positive through a 1.0% relative spread per
  # leg and turns negative at 1.5%. This is intentionally stricter than the
  # 5.13% observed ceiling: an executable quote is not necessarily a profitable
  # one. Wide books produce a documented refusal, never a desperation fill.
  # `max_relative_spread` is refreshed from the live book at 09:55. It is an
  # observation, not permission to loosen the P&L rule below.
  max_relative_spread: 0.0380       # MEASURED 2026-09-04 by scripts/calibrate_costs.py
  # Hard policy ceiling validated by the spread-sensitivity replay. Calibration
  # must never turn this into the wider raw-book percentile.
  admission_spread_cap: 0.0100      # VALIDATED P&L admission cap
  min_displayed_size: 1             # contracts on the touch
  max_quote_age_seconds: 30         # feature-staleness budget

reconstruction:
  # Rebuilding a session that was never recorded. See convex/reconstruct.py for
  # what this can and cannot recover; the short version is prints yes, the book
  # no. Six hours of discounting barely moves a solved 0DTE volatility, but the
  # rate is still assumed rather than measured, so it is listed as unmeasured
  # above. No live decision reads it, which is why the calibration check does
  # not stand the agent down for it.
  risk_free_rate: 0.043            # HYPOTHESIS: not measured against a curve
  min_coverage: 0.25               # drop a session if less of its ladder printed
  entry_time: "10:00"              # the same entry the live cycle uses

classifier:
  min_train_days: 60                # burn-in below which the rule fallback runs instead
  confidence_band: 0.03             # stand down when |p - 0.5| falls inside this
  l2_c: 1.0                         # inverse regularisation strength
  # How far above the majority baseline an out-of-sample hit rate must sit
  # before the fitted model is allowed into the live path, measured in standard
  # errors of that baseline rather than in a flat margin someone chose. A
  # family that does not clear it keeps the documented rule, which is the
  # better outcome: a model that has learned only the base rate still looks
  # like evidence, and that is worse than a rule that admits what it is.
  min_skill_sigmas: 2.0
  # The regime rule compares today's implied variance against prior implied
  # readings, rebuilt from the tape by scripts/variance_history.py. Two guards
  # on that file, both of which stand the session down rather than guess: the
  # newest reading may not be older than this many days, and there must be at
  # least this many readings from before the session being decided. A rule
  # reading a stale or thin history is worse than a rule that admits it cannot
  # see, because it is the only thing choosing direction while no model ships.
  variance_history_max_age_days: 5
  variance_history_min_readings: 30

risk:
  risk_pct_per_structure: 0.01      # 1% of equity
  # The replacement profile is deliberately observed one lot at a time. This
  # cap is independent of the loss and ES budgets: both still have to pass.
  max_contracts_per_structure: 1
  min_net_edge_dollars: 25.0        # no trade on a nominal edge after all costs
  # A positive point estimate is insufficient. The one-sided lower bound uses
  # the candidate's historical scenario distribution and must remain positive.
  net_edge_confidence_level: 0.95
  min_net_edge_lower_bound_dollars: 0.01
  max_concurrent_structures: 1      # one attributable atomic exit at a time
  portfolio_es_cap_pct: 0.03        # projected portfolio ES(1%) ceiling
  daily_loss_limit_pct: 0.03
  cumulative_fee_budget_pct: 0.02
  es_confidence: 0.01               # the 1% in ES(1%)

strategy:
  # The installed 10:00 ET timer dispatches to this isolated profile. The
  # legacy structures list remains empty, so it cannot open a generic vertical.
  active_profile: gap_continuation_vertical
  gap_continuation:
    # Research-policy inputs for the bounded paper profile. These are strategy
    # hypotheses, not calibration measurements; profile_backtest.py must clear
    # the same untouched holdout before any value is promoted.
    minimum_gap: 0.003
    minimum_vwap_distance: 0.0
    # The existing confidence gate expects a score. This fixed score is an
    # integration value for a deterministic rule, not a calibrated forecast.
    admission_score: 0.75
    execution_start: "10:01"
    execution_end: "10:03"

structures:
  # Disabled after the 2026-09-02 chronological audit. At a 1.0% per-leg
  # spread, put BWB made +440.14 in the first 124 sessions but -349.55 over the
  # untouched final 54; call BWB was negative in both. Neither beats cash after
  # costs, so no family is permitted to create new risk until a replacement
  # passes the same walk-forward test.
  enabled: []
  tie_break_order: []

paths:
  ledger: data/ledger/decisions.jsonl
  mcp_log: data/logs/alpaca-mcp.log
  chain_archive: data/chains        # the 10:00 snapshots training reads
  scenario_archive: data/scenarios  # the terminal distributions used to price
  variance_history: data/variance/implied.json   # prior implied readings for the regime rule
  models: data/models
  backtest_report: data/backtest.json
  kill_switch: data/KILL
