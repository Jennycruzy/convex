[project]
name = "convex"
version = "0.1.0"
description = "Cost-aware, tail-budgeted 0DTE SPY options agent"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas-market-calendars>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["convex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
