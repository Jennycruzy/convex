# Live config as deployed, TLS added by certbot. Install with:
#   sudo cp deploy/nginx-convex.conf /etc/nginx/sites-available/convex
#   sudo ln -s /etc/nginx/sites-available/convex /etc/nginx/sites-enabled/convex
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d convex.isobars.xyz --redirect

# Publishes the dashboard on its own name, proxying to the loopback service.
#
# Install with:
#   sudo cp deploy/nginx-convex.conf /etc/nginx/sites-available/convex
#   sudo ln -s /etc/nginx/sites-available/convex /etc/nginx/sites-enabled/convex
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d convex.isobars.xyz
#
# The A record for convex.isobars.xyz must point at this host before certbot

server {
    server_name convex.isobars.xyz;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/convex.isobars.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/convex.isobars.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = convex.isobars.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name convex.isobars.xyz;
    return 404; # managed by Certbot


}