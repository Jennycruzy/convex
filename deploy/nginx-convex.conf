# Publishes the dashboard on its own name, proxying to the loopback service.
#
# Install with:
#   sudo cp deploy/nginx-convex.conf /etc/nginx/sites-available/convex
#   sudo ln -s /etc/nginx/sites-available/convex /etc/nginx/sites-enabled/convex
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d convex.example.xyz
#
# Replace convex.example.xyz with the real name, and point an A/AAAA record at
# this host before requesting the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name convex.example.xyz;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
